services:
  atlas:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Optional — enable at work with: docker compose --profile vllm up -d
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:latest
    command: >
      --model ${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct-AWQ}
      --quantization awq
      --gpu-memory-utilization 0.90
      --max-model-len 8192
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
